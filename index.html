<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MM">
  <meta name="description" content="目標管理・日誌・ルーティン管理アプリ">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>MM</title>

  <!-- PWA マニフェスト -->
  <link rel="manifest" href="manifest.json">

  <!-- アイコン -->
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">

  <!-- Google Fonts（日本語フォント） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Kiwi+Maru&family=Zen+Maru+Gothic&family=M+PLUS+Rounded+1c&family=Hachi+Maru+Pop&family=Yuji+Syuku&family=Shippori+Mincho&family=Noto+Serif+JP&family=Sawarabi+Mincho&display=swap" rel="stylesheet">

  <!-- スタイル -->
  <link rel="stylesheet" href="css/style.css?v=270">
  <link rel="stylesheet" href="css/noteview.css?v=270">

  <!-- iOS対応 -->
  <style>
    /* iOS Safari のバウンススクロール対策 */
    html, body {
      overscroll-behavior: none;
    }

    /* ローディング画面 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    .loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .loading-title {
      color: white;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- ローディング画面 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">🎯</div>
    <div class="loading-title">MM</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- メインアプリ -->
  <div class="app" id="app">
    <!-- JavaScriptで描画 -->
  </div>

  <!-- スクリプト（v201: DB初期化修正） -->
  <script src="js/db.js?v=270"></script>
  <script src="js/icons.js?v=270"></script>
  <script src="js/pages.js?v=270"></script>
  <script src="js/noteview.js?v=270"></script>
  <script src="js/app.js?v=270"></script>

  <!-- サンプルデータ投入（初回のみ自動実行、後で削除する） -->
  <script src="seed-data.js?v=1"></script>

  <script>
    // ローディング画面を非表示
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hide');
      }, 500);
    });
  </script>
</body>
</html>
